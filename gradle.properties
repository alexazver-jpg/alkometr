# Настройки самого Gradle (не приложения). Формат .properties: «ключ=значение»,
# строка, начинающаяся с #, — комментарий. Файл читается при каждом запуске сборки.
#
# Ключи org.gradle.* относятся к демону Gradle — фоновому процессу, который держит
# проект в памяти между запусками и поэтому собирает быстрее.

# Аргументы JVM демона: -Xmx2048m — не больше 2048 МБ памяти,
# -Dfile.encoding=UTF-8 — читать файлы в UTF-8, иначе русские строки и комментарии ломаются.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Разрешает параллельно собирать независимые модули — быстрее на многоядерных машинах.
org.gradle.parallel=true

# Включает локальный кеш результатов задач: если входные данные не менялись,
# задача берёт готовый результат, а не выполняется заново.
org.gradle.caching=true

# Говорит Android-плагину использовать AndroidX (современные библиотеки поддержки)
# вместо устаревших com.android.support.
android.useAndroidX=true

# Просит Kotlin-плагин соблюдать официальный стиль оформления кода.
kotlin.code.style=official
