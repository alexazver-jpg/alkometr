# Каталог версий (version catalog) — единый список версий и зависимостей проекта.
# Формат TOML, комментарии начинаются с #.
# Обращение из build-файлов: libs.versions.<имя> — версия, libs.<имя> — библиотека,
# libs.plugins.<имя> — плагин. Смысл: версия задана один раз, а не разбросана по модулям.

[versions]
# Секция версий. Версия — точный номер публикации артефакта: одинаковый номер = одинаковый код,
# поэтому версии фиксируют явно, а не берут «последнюю попавшуюся».
# AGP (Android Gradle Plugin) — «переводчик» между Android SDK и Gradle: собирает ресурсы,
# подписывает APK, запускает lint. Чем выше версия, тем новее поддерживаемые инструменты SDK.
agp = "9.5.1"
# Версия языка Kotlin и компилятора; на неё же ссылаются плагины compose и serialization.
kotlin = "2.2.10"
# BOM (Bill of Materials) Compose — не код, а «прайс-лист» согласованных версий:
# все compose-библиотеки берут версии из него и гарантированно совместимы друг с другом.
composeBom = "2026.09.00"
# Activity Compose — мост между Activity и Compose: setContent { } и интеграция с жизненным циклом.
activityCompose = "1.13.0"
# Lifecycle: viewModel() в Compose и collectAsStateWithLifecycle (подписка с учётом видимости экрана).
lifecycle = "2.11.0"
# DataStore Preferences — асинхронное хранилище «ключ-значение» для настроек и истории.
datastore = "1.3.0"
# kotlinx.serialization — превращение Kotlin-объектов в JSON и обратно (резервная копия данных).
serializationJson = "1.9.0"
# JUnit 4 — библиотека для юнит-тестов, которые выполняются на JVM без устройства.
junit = "4.13.2"

[libraries]
# Секция библиотек. Запись { group, name, version.ref } — это координаты зависимости:
# группа (организация-издатель), имя артефакта и ссылка на версию из секции [versions].
# Activity Compose — точка входа Compose в Activity (setContent { }); версия из [versions].
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# BOM подключается через platform(): сама по себе она кода не содержит,
# только выравнивает версии всех compose-библиотек.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Базовый UI-фреймворк Compose (Modifier, Layout, State); версию подставит BOM, поэтому её нет в записи.
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# Графика Compose: Color, рисование на Canvas (шкала и график выветривания).
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
# ui-tooling — превью и инспектор в Android Studio; нужен только в debug-сборке.
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Аннотация @Preview, которая позволяет смотреть composable в IDE без запуска приложения.
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Material 3 — готовые компоненты (Button, Scaffold, AlertDialog) и система тем.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# material-icons-core — базовый набор иконок (ArrowBack и т.п.).
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# viewModel() в Compose: получение ViewModel, привязанной к экрану/Activity.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# collectAsStateWithLifecycle: сбор Flow только пока экран видим (не тратим ресурсы в фоне).
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# DataStore: сохранение настроек между запусками приложения.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# JSON-часть kotlinx.serialization: бэкап истории в строку и восстановление из неё.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
# JUnit: аннотации @Test и проверки assertEquals в юнит-тестах.
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
# Секция плагинов. id — официальный идентификатор плагина в репозиториях,
# version.ref — версия, объявленная выше (AGP и Kotlin используются одни и те же во всём проекте).
android-application = { id = "com.android.application", version.ref = "agp" }
# Компилятор Compose: с Kotlin 2.0 вынесен в отдельный плагин и обязателен для @Composable.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Генератор кода (де)сериализации для классов, помеченных @Serializable.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
