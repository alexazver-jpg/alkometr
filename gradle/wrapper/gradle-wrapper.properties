# Параметры Gradle Wrapper — «загрузчика» Gradle.
# Wrapper позволяет не устанавливать Gradle вручную: при первом запуске он сам скачает нужную версию.
distributionBase=GRADLE_USER_HOME
# Куда распаковывать скачанный дистрибутив (в пользовательский кэш Gradle).
distributionPath=wrapper/dists
# Точный адрес дистрибутива. Версию 9.8.2 менять нельзя — проект проверен именно на ней.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
# Сколько ждать ответа сети при скачивании, миллисекунды.
networkTimeout=10000
# Проверять, что скачанный архив действительно с официального адреса.
validateDistributionUrl=true
# Где хранить скачанный zip (тот же кэш Gradle).
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists